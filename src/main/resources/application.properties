
spring.datasource.url=jdbc:mysql://localhost:3306/reconagent
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto=update
# Show SQL queries in the console (useful for debugging)
spring.jpa.show-sql=true
# Format SQL output beautifully in console log
spring.jpa.properties.hibernate.format_sql=true
# Hibernate SQL dialect for MySQL 8+ optimization
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
anthropic.api.key=${ANTHROPIC_API_KEY}
anthropic.api.url=https://api.anthropic.com/v1/messages
anthropic.model=claude-sonnet-4-5-20250929
server.port=8081